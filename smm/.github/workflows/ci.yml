name: SINERGY SMM CI
on:
  push:
    branches: [synergy-smm-v1]
    paths: ['smm/**']
  pull_request:
    paths: ['smm/**']
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smm/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. pytest -q
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smm/apps/web-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
