name: SINERGY SMM CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r smm/backend/requirements.txt
      - run: python -m compileall smm/backend smm/workers
      - run: python -c "import sys; sys.path.insert(0,'smm/backend'); from app.main import app; assert app.version=='1.0.0'"
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: cd smm/apps/web-admin && npm install && npm run build
