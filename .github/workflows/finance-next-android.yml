name: Finance NEXT Android debug
on:
  workflow_dispatch:
  push:
    branches: [feat/finance-next-android-v2-5]
    paths: ['finance-next/**', '.github/workflows/finance-next-android.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore complete source and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import zipfile
          parts = sorted(Path('finance-next/source-parts').glob('part-*.bin'))
          assert len(parts) == 31, f'Expected 31 parts, got {len(parts)}'
          dest = Path('finance-next/finance-next-android.zip')
          with dest.open('wb') as out:
              for part in parts: out.write(part.read_bytes())
          digest = sha256(dest.read_bytes()).hexdigest()
          expected = '46b667dd457c6a8a04b14675061f6df0c68959491010c8892d45fb6934c071a4'
          assert digest == expected, f'SHA mismatch: {digest}'
          source = Path('finance-next/source')
          source.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(dest) as z:
              bad = z.testzip()
              assert bad is None, f'Bad ZIP member: {bad}'
              z.extractall(source)
          assert (source/'android-studio/settings.gradle.kts').exists()
          import shutil
          shutil.copytree(source/'android-studio/app/src/main/assets/www', source/'web')
          print('Verified complete Android source', digest)
          PY
      - name: Validate bundled resources and theme
        working-directory: finance-next/source/android-studio
        run: |
          python3 scripts/check_embedded_resources.py
          python3 scripts/check_syn26_theme.py
      - name: Build independent Android APK
        working-directory: finance-next/source/android-studio
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SYNERGY-FINANCE-NEXT-v2.5.0-debug-apk
          path: finance-next/source/android-studio/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
