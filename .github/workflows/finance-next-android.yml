name: Finance NEXT Android debug
on:
  workflow_dispatch:
  push:
    branches: [feat/finance-next-android-v2-5]
    paths: ['finance-next/**', '.github/workflows/finance-next-android.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install SDK
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Require complete source
        run: |
          test -f finance-next/source/android-studio/settings.gradle.kts || { echo "Missing Android source files; cannot build APK"; exit 1; }
      - name: Validate app content
        working-directory: finance-next/source/android-studio
        run: |
          python3 scripts/check_embedded_resources.py
          python3 scripts/check_syn26_theme.py
      - name: Build independent APK
        working-directory: finance-next/source/android-studio
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SYNERGY-FINANCE-NEXT-debug-apk
          path: finance-next/source/android-studio/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
