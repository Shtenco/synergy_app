name: iOS archive
on:
  workflow_dispatch:
jobs:
  archive:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer || true
      - name: Archive (requires signing configured in Apple Developer/App Store Connect)
        env: {SINERGY_APPLE_TEAM_ID: '${{ secrets.SINERGY_APPLE_TEAM_ID }}'}
        run: ./scripts/build_ios_archive.sh
      - uses: actions/upload-artifact@v4
        with: {name: sinergy-finance-xcarchive, path: 'ios/build/SinergyFinance.xcarchive'}
