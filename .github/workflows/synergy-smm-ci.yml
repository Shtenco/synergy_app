name: SINERGY SMM CI

on:
  push:
    branches: [synergy-smm-v1]
    paths:
      - 'smm/**'
      - '.github/workflows/synergy-smm-ci.yml'
  pull_request:
    paths:
      - 'smm/**'

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smm/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smm/apps/web-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build

  mobile-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd smm/apps/mobile && npm install
      - run: node -e "const c=require('./smm/apps/mobile/app.json'); if(c.expo.ios.bundleIdentifier!=='ai.sinergy.smm'||c.expo.android.package!=='ai.sinergy.smm') process.exit(1); console.log('mobile identifiers OK')"
