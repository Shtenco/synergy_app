name: Android signed AAB
on:
  workflow_dispatch:
jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Decode upload keystore
        env: {KS_B64: '${{ secrets.SINERGY_KEYSTORE_B64 }}'}
        run: echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/sinergy-upload.jks"
      - name: Build AAB
        env:
          SINERGY_KEYSTORE_FILE: '${{ runner.temp }}/sinergy-upload.jks'
          SINERGY_KEYSTORE_PASSWORD: '${{ secrets.SINERGY_KEYSTORE_PASSWORD }}'
          SINERGY_KEY_ALIAS: '${{ secrets.SINERGY_KEY_ALIAS }}'
          SINERGY_KEY_PASSWORD: '${{ secrets.SINERGY_KEY_PASSWORD }}'
        run: ./scripts/build_android_aab.sh
      - uses: actions/upload-artifact@v4
        with: {name: sinergy-finance-aab, path: 'android/app/build/outputs/bundle/release/*'}
