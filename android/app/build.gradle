plugins { id 'com.android.application' }

android {
    namespace 'ai.sinergy.finance'
    compileSdk 36

    defaultConfig {
        applicationId 'ai.sinergy.finance'
        minSdk 26
        targetSdk 36
        versionCode 810
        versionName '8.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            def ks = System.getenv('SINERGY_KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('SINERGY_KEYSTORE_PASSWORD')
                keyAlias System.getenv('SINERGY_KEY_ALIAS')
                keyPassword System.getenv('SINERGY_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release {
            minifyEnabled false
            shrinkResources false
            if (System.getenv('SINERGY_KEYSTORE_FILE')) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { resources.excludes += ['/META-INF/{AL2.0,LGPL2.1}'] }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    testImplementation 'junit:junit:4.13.2'
}
